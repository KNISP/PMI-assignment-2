[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools', 'wheel']

[project]
name = 'pmi-lib'
version = '0.0.1'
description = 'PMI library - Group 5'
readme = 'README.md'
requires-python = '>=3.14'
license = 'MIT'
license-files = ['LICENSE.md']
authors = [
  {name = 'Agata Leszczak', email = 'a.k.leszczak@students.uu.nl'},
  {name = 'Luc Hampsink', email = 'member2@students.uu.nl'},
  {name = 'Nienke Metzger', email = 'member3@students.uu.nl'},
  {name = 'Jeannette Stepanyan', email = 'j.stepanyan@students.uu.nl'},
]
dependencies = ["nibabel", "numpy", "pydicom", "scipy", "click"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dicom-to-nifti = "pmi_lib.cli:dicom_to_nifti"